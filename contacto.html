<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto & Login | ECJ Studio</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .contact-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
    }
    @media (max-width: 768px) {
      .contact-wrapper { grid-template-columns: 1fr; }
    }
    .form-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      padding: 2rem;
      border-radius: 8px;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 0.8rem;
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 4px;
    }
    .social-btn {
      display: block;
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 0.8rem;
      border-radius: 4px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-google { background-color: #db4437; color: white; }
    .btn-insta { background-color: #c13584; color: white; }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
     <a href="index.html" class="logo-brand">
  <img src="img/logo.png" alt="ECJ Studio Logo" class="logo-img">
</a>
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="galeria.html">Galería</a></li>
        <li><a href="tienda.html">Tienda</a></li>
        <li><a href="contacto.html" class="active">Contacto</a></li>
      </ul>
    </div>
  </header>

  <main class="container">
    <div class="page-title">
      <h1>Contacto y Cuenta</h1>
      <p>Envíanos un mensaje o inicia sesión para gestionar tus reservas</p>
    </div>

    <div class="contact-wrapper">
      <!-- Formulario de Contacto / Reserva -->
      <div class="form-box">
        <h2 style="margin-bottom: 1.5rem; color: var(--accent);">Envíanos un Mensaje</h2>
        <form onsubmit="alert('¡Mensaje enviado con éxito!'); return false;">
          <div class="form-group">
            <label>Nombre Completo</label>
            <input type="text" required placeholder="Tu nombre">
          </div>
          <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" required placeholder="tu@email.com">
          </div>
          <div class="form-group">
            <label>Mensaje / Fecha propuesta para sesión</label>
            <textarea rows="4" required placeholder="Detalles de lo que necesitas..."></textarea>
          </div>
          <button type="submit" class="btn">Enviar Mensaje</button>
        </form>
      </div>

      <!-- Sistema de Login Social -->
      <div class="form-box">
        <h2 style="margin-bottom: 1.5rem; color: var(--accent);">Acceso Clientes</h2>
        <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Inicia sesión para ver el estado de tus fotos y pedidos.</p>
        
        <button class="social-btn btn-google" onclick="alert('Iniciando sesión con Google...')">Continuar con Google</button>
        <button class="social-btn btn-insta" onclick="alert('Iniciando sesión con Instagram...')">Continuar con Instagram</button>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 ECJ Studio. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
