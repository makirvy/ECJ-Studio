<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería | ECJ Studio</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .gallery-item {
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid var(--border);
      height: 320px;
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .gallery-item:hover img {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- Header con Logo PNG -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo-brand">
        <img src="img/logo.png" alt="ECJ Studio Logo" class="logo-img">
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="galeria.html" class="active">Galería</a></li>
        <li><a href="tienda.html">Tienda</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </div>
  </header>

  <main class="container">
    <div class="page-title">
      <h1>Galería de Trabajos</h1>
      <p>Explora nuestras mejores producciones y proyectos fotográficos</p>
    </div>

    <div class="gallery-grid">
      <div class="gallery-item"><img src="img/imgG1.jpeg" alt="Foto Galería 1"></div>
      <div class="gallery-item"><img src="img/imgG2.jpeg" alt="Foto Galería 2"></div>
      <div class="gallery-item"><img src="img/imgG3.jpeg" alt="Foto Galería 3"></div>
      <div class="gallery-item"><img src="img/imgG4.jpeg" alt="Foto Galería 4"></div>
      <div class="gallery-item"><img src="img/imgG5.jpeg" alt="Foto Galería 5"></div>
      <div class="gallery-item"><img src="img/imgG6.jpeg" alt="Foto Galería 6"></div>
    </div>
  </main>

  <footer>
    <div class="container footer-content">
      <div class="footer-brand">
        <a href="index.html" class="logo-brand">
          <img src="img/logo.png" alt="ECJ Studio Logo" class="logo-img">
        </a>
        <p style="color: var(--text-secondary); margin-top: 0.5rem;">Estudio de fotografía profesional y producción audiovisual.</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 ECJ Studio. Todos los derechos reservados.</p>
    </div>
  </footer>

</body>
</html>
