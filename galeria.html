  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* --- ESTILOS ESPECÍFICOS DE LA GALERÍA & LIGHTBOX --- */
    
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      padding: 2rem 0;
    }

    .gallery-item {
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid var(--border);
      height: 350px;
      cursor: pointer; /* Mano para indicar clic */
      position: relative;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    /* Efecto Hover: agranda imagen y pone overlay */
    .gallery-item:hover img {
      transform: scale(1.08);
    }

    .item-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      color: var(--accent);
      font-size: 2rem;
    }

    .gallery-item:hover .item-overlay {
      opacity: 1;
    }

    /* --- ESTILOS DEL LIGHTBOX (Visualizador) --- */
    .lightbox {
      display: none; /* Oculto por defecto */
      position: fixed;
      z-index: 2000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9); /* Fondo negro traslúcido */
      align-items: center;
      justify-content: center;
      cursor: zoom-out; /* Cursor para cerrar */
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    /* Clase para mostrar el lightbox */
    .lightbox.active {
      display: flex;
      opacity: 1;
    }

    .lightbox-content {
      max-width: 90%;
      max-height: 90%;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .lightbox.active .lightbox-content {
      transform: scale(1);
    }

    /* Botón cerrar (X) */
    .close-lightbox {
      position: absolute;
      top: 20px;
      right: 30px;
      color: var(--text-primary);
      font-size: 3rem;
      font-weight: bold;
      cursor: pointer;
      z-index: 2001;
    }

    .close-lightbox:hover {
      color: var(--accent);
    }

  </style>
</head>

  <!-- JAVASCRIPT CORREGIDO PARA USAR TUS IMÁGENES -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const gallery = document.getElementById('gallery');
      const lightbox = document.getElementById('lightbox');
      const lightboxImage = document.getElementById('lightboxImage');
      const closeLightbox = document.getElementById('closeLightbox');

      // 1. Abrir Lightbox
      gallery.addEventListener('click', (e) => {
        const item = e.target.closest('.gallery-item');
        
        if (item) {
          // Obtenemos la imagen que está dentro del item cliqueado
          const img = item.querySelector('img');
          // Usamos el mismo src de la imagen pequeña para la grande
          lightboxImage.src = img.src;
          lightbox.classList.add('active');
          document.body.style.overflow = 'hidden'; // Quita scroll
        }
      });

      // 2. Cerrar en la X
      closeLightbox.addEventListener('click', () => {
        lightbox.classList.remove('active');
        document.body.style.overflow = ''; // Pone scroll
      });

      // 3. Cerrar al clicar fuera de la imagen
      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) {
          lightbox.classList.remove('active');
          document.body.style.overflow = '';
        }
      });

      // 4. Cerrar con tecla Escape
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && lightbox.classList.contains('active')) {
          lightbox.classList.remove('active');
          document.body.style.overflow = '';
        }
      });
    });
  </script>
